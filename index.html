<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti 🎶</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      cursor: pointer;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 90%;
    }
    h1 { color: #333; font-size: 1.5rem; margin-bottom: 10px; }
    p { color: #666; font-size: 1rem; }
    .pulse {
      font-size: 3rem;
      margin-top: 15px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body onclick="activarAudio()">

  <div class="card">
    <h1>Haz clic o toca en cualquier lugar</h1>
    <p>Para comenzar la reproducción</p>
    <div class="pulse">🎵</div>
  </div>

  <!-- Quitamos 'loop' para que no se repita -->
  <audio id="miAudio" preload="auto">
    <source src="AudioQR1.mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <script>
    const audio = document.getElementById('miAudio');
    let reproducido = false;

    function activarAudio() {
      if (!reproducido) {
        audio.play().then(() => {
          reproducido = true;
          document.querySelector('.card').style.display = 'none';
          document.body.style.cursor = 'default';
        }).catch(error => {
          console.log("Error al reproducir:", error);
        });
      }
    }
  </script>
</body>
</html>
